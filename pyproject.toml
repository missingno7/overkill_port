[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "overkill-source-port"
version = "0.1.0"
description = "Separated DOS RE toolkit and OVERKILL reverse-engineered source-port layers"
requires-python = ">=3.11"
# The 8086 interpreter core, headless verifier, and dependency-free test runner
# intentionally have no third-party runtime dependencies.  Optional extras below
# install the SDL viewer, pytest, and AdLib CFFI support when needed.
dependencies = []

[project.scripts]
overkill = "overkill.cli:main"

[tool.pytest.ini_options]
# "." for overkill/, "dos_re" for the framework submodule (dos_re/ here is the
# submodule's own repo root, not the package itself -- that's dos_re/dos_re/).
pythonpath = [".", "dos_re"]

[project.optional-dependencies]
viewer = [
    "numpy>=1.23",
    "pygame>=2.5",
]
test = [
    "pytest>=8",
    "pytest-xdist>=3",  # parallel suites: python -m pytest tests -q -n auto
]
adlib = [
    "cffi>=1.15",
]

[tool.setuptools.packages.find]
# dos_re is an external submodule now (its own package, installed separately
# via `pip install -e dos_re/`), not part of this project's own sources.
include = ["overkill*"]
