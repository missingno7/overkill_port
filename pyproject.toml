[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "overkill-source-port"
version = "0.1.0"
description = "Separated DOS RE toolkit and OVERKILL reverse-engineered source-port layers"
requires-python = ">=3.11"
# The 8086 interpreter core, headless verifier, and dependency-free test runner
# intentionally have no third-party runtime dependencies.  Optional extras below
# install the SDL viewer, pytest, and AdLib CFFI support when needed.
dependencies = []

[project.scripts]
overkill = "overkill.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[project.optional-dependencies]
viewer = [
    "numpy>=1.23",
    "pygame>=2.5",
]
test = [
    "pytest>=8",
]
adlib = [
    "cffi>=1.15",
]

[tool.setuptools.packages.find]
include = ["dos_re*", "overkill*", "nuked_opl3*"]

[tool.setuptools.package-data]
"nuked_opl3" = ["vendor/*.c", "vendor/*.h", "README.md", "LICENSE"]
