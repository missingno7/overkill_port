[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "overkill-source-port"
version = "0.1.0"
description = "Separated DOS RE toolkit and OVERKILL reverse-engineered source-port layers"
requires-python = ">=3.11"
# The 8086 interpreter core has no third-party dependencies.  The interactive
# viewer (scripts/play.py) needs pygame (SDL) for display/input and numpy for the
# vectorised frame decode; both are imported only when the viewer launches.
dependencies = [
    "numpy>=1.23",
    "pygame>=2.5",
]

[project.scripts]
overkill = "overkill.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[project.optional-dependencies]
adlib = [
    "cffi>=1.15",
]

[tool.setuptools.packages.find]
include = ["dos_re*", "overkill*", "nuked_opl3*"]

[tool.setuptools.package-data]
"nuked_opl3" = ["vendor/*.c", "vendor/*.h", "README.md", "LICENSE"]
